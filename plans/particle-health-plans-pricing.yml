specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Particle Health
providerId: particle-health
created: '2026-05-24'
modified: '2026-05-24'
tags:
  - Carequality
  - CommonWell
  - eHealth Exchange
  - FHIR
  - Health Data
  - HIE
  - Interoperability
  - Patients
  - QHIN
  - TEFCA
description: Machine-readable plans and pricing scaffold for Particle Health. Particle is sales-led
  with custom commercial agreements; numeric tier limits below are scaffold defaults pending publication
  by Particle Health. Sandbox access is free for evaluation.
plans:
  - id: particle-health-sandbox
    name: Sandbox
    type: freemium
    description: Privacy-safe sandbox environment for development, prototyping, and testing of Particle
      Health workflows using synthetic patient data. No production network queries.
    entries:
      - label: Sandbox Queries
        description: Synthetic patient query quota in the sandbox environment
        name: sandbox_queries
        type: quota
        metric: requests
        limit: -1
        timeFrame: month
        geo: global
        domains:
          - https://api.particlehealth.com
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Rate Limit
        description: Default per-project sandbox rate limit
        name: rate_limit
        type: rate
        metric: requests_per_minute
        limit: 50
        timeFrame: minute
        geo: global
        domains:
          - https://api.particlehealth.com
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Sandbox Access
      - name: Synthetic Patient Data
      - name: Webhook Sandbox Trigger
      - name: Public Documentation
      - name: Postman Collection
  - id: particle-health-production
    name: Production
    type: paid
    description: Production tier providing live network queries against Carequality, CommonWell,
      eHealth Exchange, TEFCA partners, and state HIEs. Pricing is custom-negotiated with Particle
      Health based on patient volume, modalities, and product modules.
    entries:
      - label: Patient Queries
        description: Live network queries against connected HIEs and TEFCA partners
        name: patient_queries
        type: quota
        metric: queries
        limit: TBD
        timeFrame: month
        geo: us
        domains:
          - https://api.particlehealth.com
        unit: 1
        price: TBD
        userMultiplied: false
      - label: Rate Limit
        description: Default per-project rate limit for production
        name: rate_limit
        type: rate
        metric: requests_per_minute
        limit: 50
        timeFrame: minute
        geo: us
        domains:
          - https://api.particlehealth.com
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Signal Subscriptions
        description: Patients subscribed to Signal for real-time encounter and transition alerts
        name: signal_subscriptions
        type: quota
        metric: subscribed_patients
        limit: TBD
        timeFrame: month
        geo: us
        domains:
          - https://api.particlehealth.com
        unit: 1
        price: TBD
        userMultiplied: false
    elements:
      - name: Carequality Network Access
      - name: CommonWell Network Access
      - name: eHealth Exchange Network Access
      - name: TEFCA / QHIN Access
      - name: State HIE Access (Healthix, Manifest MedEx)
      - name: Surescripts Pharmacy Data
      - name: FHIR R4 Data Retrieval
      - name: C-CDA Data Retrieval
      - name: Flat Data Retrieval
      - name: Deltas Incremental Sync
      - name: Particle Signal Alerts
      - name: Webhook Subscriptions
      - name: Email Support
  - id: particle-health-enterprise
    name: Enterprise
    type: enterprise
    description: Custom-negotiated enterprise tier including dedicated capacity, contractual SLAs,
      compliance review (HIPAA, HITRUST, SOC 2), named technical account management, and access to
      AI products (Particle Snapshot, Workbench, Navigator) and specialty datasets (FOCUS).
    entries:
      - label: Patient Queries
        description: Negotiated query volume; -1 indicates uncapped subject to fair use
        name: patient_queries
        type: quota
        metric: queries
        limit: -1
        timeFrame: month
        geo: us
        domains:
          - https://api.particlehealth.com
        unit: 1
        price: custom
        userMultiplied: false
      - label: Rate Limit
        description: Negotiated burst and steady-state rate per project
        name: rate_limit
        type: rate
        metric: requests_per_minute
        limit: 500
        timeFrame: minute
        geo: us
        domains:
          - https://api.particlehealth.com
        unit: 1
        price: custom
        userMultiplied: false
    elements:
      - name: Unlimited / Negotiated Query Volume
      - name: 24/7 Dedicated Support
      - name: Contractual SLA
      - name: HIPAA, HITRUST, SOC 2 Compliance Documentation
      - name: Particle Snapshot (AI Clinical Summaries)
      - name: Particle Signal (Real-Time Alerts)
      - name: Particle Workbench (Analytics)
      - name: Particle Navigator (Patient Journey)
      - name: Particle FOCUS (Curated Specialty Datasets)
      - name: TEFCA in a Box
      - name: Dedicated Account Manager
      - name: Custom Data Residency
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
