naftiko: 1.0.0-alpha2
info:
  label: Particle Health API — CCDA
  description: 'Particle Health API — Consolidated CDA document retrieval. Download raw CCDA bundles
    aggregated from connected networks.'
  tags:
  - Particle Health
  - C-CDA
  - HL7
  created: '2026-05-24'
  modified: '2026-05-24'
binds:
- namespace: env
  keys:
    PARTICLE_HEALTH_API_TOKEN: PARTICLE_HEALTH_API_TOKEN
capability:
  consumes:
  - type: http
    namespace: ccda
    baseUri: https://api.particlehealth.com
    description: Particle Health CCDA business capability.
    resources:
    - name: PatientCcda
      path: /api/v2/patients/{particle_patient_id}/ccda
      operations:
      - name: getccdafiles
        method: GET
        description: Get CCDA Files for a Patient
        outputRawFormat: binary
        outputParameters: [{ name: result, type: binary, value: $. }]
    authentication:
      type: bearer
      token: '{{env.PARTICLE_HEALTH_API_TOKEN}}'
  exposes:
  - type: rest
    namespace: ccda-rest
    port: 8080
    description: REST adapter for Particle Health CCDA.
    resources:
    - path: /v1/patients/{particle_patient_id}/ccda
      name: ccda
      operations:
      - method: GET
        name: getccdafiles
        description: Get CCDA Files
        call: ccda.getccdafiles
        outputParameters: [{ type: binary, mapping: $. }]
  - type: mcp
    namespace: ccda-mcp
    port: 9090
    transport: http
    description: MCP adapter for Particle Health CCDA.
    tools:
    - name: get-ccda-files
      description: Get CCDA Files for a Patient
      hints: { readOnly: true, destructive: false, idempotent: true }
      call: ccda.getccdafiles
      outputParameters: [{ type: binary, mapping: $. }]
