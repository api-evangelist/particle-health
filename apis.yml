aid: particle-health
name: Particle Health
description: >-
  Particle Health is a healthcare data interoperability platform that aggregates patient medical records from across the
  US healthcare system into a single RESTful API. Particle is connected to all three nationwide health information
  exchange networks (Carequality, CommonWell, eHealth Exchange), TEFCA / QHIN partners, state HIEs (Healthix in New
  York, Manifest MedEx in California), and Surescripts for pharmacy data. The platform exposes patient demographics,
  clinical resources, and document retrieval via FHIR R4, C-CDA, Flat, and Deltas formats, layered with deduplication,
  normalization, AI summarization (Particle Snapshot), real-time encounter and transition alerts (Particle Signal), and
  longitudinal patient journey tracking (Particle Navigator). Customer segments include value-based care organizations,
  payers, health systems, primary and specialty providers, and digital health developers.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
