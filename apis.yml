apis:
  - aid: particle-health:patient-data-api
    name: Particle Health API
    description: >-
      The Particle Health API is a RESTful interface for patient demographic registration, clinical data querying, and
      document retrieval across all major US health information networks. Developers register a patient via
      demographics, submit a query under a defined Purpose of Use, and asynchronously receive normalized clinical data
      in FHIR R4 Bundles, C-CDA documents, Flat datasets, or Deltas (incremental change sets). The API also exposes
      batch query, network participant search, patient provider mapping, and webhook event notifications for query
      completion, ADT, transitions, encounters, and AI output. Authentication uses OAuth 2 Client-Credentials grant with
      JWT access tokens scoped to a project.
