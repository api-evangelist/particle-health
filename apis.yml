solutions:
  - Value-Based Care Patient Data Aggregation
  - Readmission Reduction with ADT Alerts
  - Care Gap Closure
  - Referral Management and Continuity of Care
  - Patient Risk Stratification
  - Treatment Eligibility Determination
  - Medication Management and Reconciliation
  - Pre-Visit Chart Preparation
  - Onboarding and Initial Patient Visit Workflows
  - Centers of Excellence Specialty Record Retrieval
  - AI-Powered Clinical Summarization
useCases:
  - Pull a longitudinal patient record from 320M+ patients across 160K+ healthcare organizations
  - Receive real-time admission, discharge, and transfer alerts for a subscribed patient cohort
  - Run a batch query over a patient panel and download FHIR R4, C-CDA, Flat, or Deltas results
  - Subscribe a patient cohort to Signal monitoring for ongoing encounter and transition alerts
  - Generate AI-driven clinical Snapshot summaries from raw aggregated medical records
  - Locate Centers of Excellence and specialty providers via Network Participant search
  - Map the set of healthcare organizations a patient has been seen at via Patient Provider Map
  - Retrieve medication prescription and fill data from pharmacies and PBMs via Surescripts
  - Submit and route Delegation of Authority (DAuth) notices for Carequality compliance
  - Test integrations against the privacy-safe Sandbox before production cutover
